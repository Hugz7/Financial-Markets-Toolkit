# Native Streamlit theme — Apple "Pro" dark aesthetic.
# Colours mirror the tokens in ui/theme.py and ui/styles.css; keep them in sync.

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#0A84FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
borderColor = "#2C2C2E"
dataframeBorderColor = "#2C2C2E"
dataframeHeaderBackgroundColor = "#141416"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "0.85rem"
buttonRadius = "full"
baseFontSize = 15
# SF Pro on Apple devices; Inter is loaded as the cross-platform fallback.
font = "-apple-system, BlinkMacSystemFont, SF Pro Text, Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, SF Pro Display, Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "SF Mono, JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2.5rem", "1.5rem", "1.2rem", "1rem", "0.95rem", "0.9rem"]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
linkColor = "#2997FF"
linkUnderline = false
greenColor = "#30D158"
redColor = "#FF453A"
yellowColor = "#FF9F0A"
blueColor = "#0A84FF"
violetColor = "#BF5AF2"
chartCategoricalColors = ["#0A84FF", "#D27306", "#BF5AF2", "#239E45", "#6E6CF0", "#FF375F", "#2A93C2", "#A88600"]

[theme.sidebar]
backgroundColor = "#0B0B0C"
secondaryBackgroundColor = "#1C1C1E"
borderColor = "#1C1C1E"
